<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- 首帧透明兜底：不依赖外链 CSS，确保第一帧就是透明，避免闪白 -->
  <style>html,body,#app,.root,.container,.card,#card{background:transparent !important;}</style>
  <style>
    /* 方形通知：外框不做圆角；内部按钮样式保持原样 */
    html, body {
      margin:0;
      height:100%;
      background: transparent !important; /* 关键：让 Acrylic 能透出桌面，避免白底 */
      overflow:hidden;
      font-family:'Segoe UI', system-ui, -apple-system;
    }
    body::-webkit-scrollbar{width:0;height:0}

    /* 去掉 WebView/浏览器的"选中边框/焦点环" */
    *{ outline:none !important; }
    *:focus{ outline:none !important; box-shadow:none !important; }
    *:focus-visible{ outline:none !important; box-shadow:none !important; }
    button:focus-visible{ outline:none !important; box-shadow:none !important; }

    .card{
      position:fixed;
      inset:0;
      width:100%; height:100%;
      border-radius:0;
      overflow:hidden;

      /* 完全透明，由 Acrylic（或 DEGRADED）主导，避免灰雾感 */
      background: transparent !important;

      border:none;
      outline:none;
      box-shadow:0 12px 34px rgba(0,0,0,0.45);
      color:#e5e7eb;
      display:flex; flex-direction:column;
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }
    .card.card-visible { opacity: 1; }

    /* 轻微内描边 */
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .titlebar{
      height:44px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 10px 0 12px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      -webkit-app-region: drag;
    }
    .title{
      display:flex; align-items:center; gap:8px;
      font-weight:700; font-size:13px; letter-spacing:.2px; color:#fff;
      user-select:none;
    }
    .dot{width:8px;height:8px;border-radius:99px;background:#3b82f6; box-shadow:0 0 10px rgba(59,130,246,0.65)}
    .close{
      width:32px;height:32px;border-radius:10px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.06);
      color:rgba(255,255,255,0.9);
      cursor:pointer;
      -webkit-app-region: no-drag;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      line-height:1;
    }
    .close:hover{filter:brightness(1.08)}

    .body{padding:14px 14px 12px 14px; display:flex; flex-direction:column; gap:12px;}
    .msg{font-size:13px; line-height:1.45; color:rgba(229,231,235,0.95)}
    .row{display:flex; gap:10px; justify-content:flex-end;}
    button{
      height:34px; padding:0 16px; border-radius:12px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.07);
      color:#e5e7eb; font-size:13px; cursor:pointer;
      transition:all 150ms;
      -webkit-app-region: no-drag;
    }
    button.primary{ background:rgba(59,130,246,0.78); border-color:rgba(59,130,246,0.82); color:#fff; }
    button:hover{filter:brightness(1.10); transform:translateY(-1px)}
    button:active{transform:translateY(0px)}

    @keyframes fadeOut { from { opacity:1 } to { opacity:0 } }
    .fade-out { animation: fadeOut 0.5s ease-out forwards; }
  </style>
  <script src="/assets/auth_bootstrap.js"></script>
</head>
<body>
  <div class="card" id="card">
    <div class="titlebar">
      <div class="title"><span class="dot"></span>休息提醒</div>
      <button class="close" id="btnClose">✕</button>
    </div>
    <div class="body">
      <div class="msg" id="msg">连续使用时间已达到提醒阈值，建议休息。</div>
      <div class="row">
        <button id="btnLater">稍后</button>
        <button class="primary" id="btnNow">立刻休息</button>
      </div>
    </div>
  </div>

  <script>
    // ----------------------------
    // notify front-end chain tracing
    // ----------------------------
    function hardNotifyLog(stage, extra){
      try{
        if(window.pywebview && window.pywebview.api && typeof window.pywebview.api.notify_log==='function'){
          window.pywebview.api.notify_log({
            stage: stage,
            wall_ms: Date.now(),
            perf_ms: (typeof performance !== 'undefined' && performance.now) ? performance.now() : null,
            acted: !!window._acted,
            hide_timer: !!window._hideTimer,
            session_id: window.__notify_session_id || null,
            extra: extra || null
          });
        }
      }catch(e){}
    }

    function notifyReadyForShow(){
      try{
        if(window.pywebview && window.pywebview.api && typeof window.pywebview.api.notify_ready_for_show === 'function'){
          window.pywebview.api.notify_ready_for_show();
        }
      }catch(e){}
    }

    function sendEnvDump(){
      try{
        var card = document.getElementById('card');
        var html = document.documentElement;
        var body = document.body;
        var htmlBg = html ? (window.getComputedStyle(html).backgroundColor || '') : '';
        var bodyBg = body ? (window.getComputedStyle(body).backgroundColor || '') : '';
        var cardBg = card ? (window.getComputedStyle(card).backgroundColor || '') : '';
        hardNotifyLog('env_dump', {
          html_bg: htmlBg,
          body_bg: bodyBg,
          card_bg: cardBg,
          devicePixelRatio: typeof devicePixelRatio !== 'undefined' ? devicePixelRatio : null,
          userAgent: (navigator && navigator.userAgent) ? navigator.userAgent.substring(0,120) : '',
          readyState: document.readyState,
          has_webview: !!(window.chrome && window.chrome.webview)
        });
      }catch(e){}
    }

    function send(action){
      try{
        // 任意用户动作都视为"已处理"，必须取消 autoHide
        window._acted = true;
        if(window._hideTimer){ try{ clearTimeout(window._hideTimer); }catch(e){} window._hideTimer=null; }
        hardNotifyLog('send_begin', {action: action});
        if(document.activeElement){ try{ document.activeElement.blur(); }catch(e){} }

        // 业务动作通过 HTTP /api/* 发送
        var base = window.location.origin || '';
        if (action === 'rest') {
          fetch(base + '/api/rest/start', {method:'POST',headers:{'Content-Type':'application/json'}}).catch(function(){});
        } else if (action === 'snooze') {
          fetch(base + '/api/rest/snooze', {method:'POST',headers:{'Content-Type':'application/json'}}).catch(function(){});
        }
        // dismiss：仅关闭窗口（fade_out -> hide），不调 rest/snooze API

        // 窗口行为（隐藏/关闭）通过 pywebview.api
        if(window.pywebview && window.pywebview.api){
          if (window.pywebview.api.notify_window_action){
            window.pywebview.api.notify_window_action(action);
          } else if (window.pywebview.api.notify_action){
            // 兼容旧桥接名
            window.pywebview.api.notify_action(action);
          }
        }
        hardNotifyLog('send_end', {action: action});
      }catch(e){}
    }
    function fadeThenSend(action){
      // 保留函数供调试，但"稍后/自动隐藏"不再走这条链路。
      // 原因：fadeThenSend 会导致内容先淡出、宿主后淡出，出现黑底留屏。
      try{
        const card=document.getElementById('card');
        if(card){
          card.classList.add('fade-out');
          setTimeout(()=>send(action), 380);
          return;
        }
      }catch(e){}
      send(action);
    }

    document.addEventListener('mousedown', (e)=>{
      try{ if(document.activeElement && e.target && e.target.tagName !== 'BUTTON'){ document.activeElement.blur(); } }catch(err){}
    }, true);

    (function(){
      var done=false;
      function fire(){ if(done) return; done=true; setTimeout(sendEnvDump, 80); requestAnimationFrame(notifyReadyForShow); }
      if(document.readyState==='complete') fire();
      else{ window.addEventListener('load', fire); document.addEventListener('DOMContentLoaded', fire); }
    })();

    document.getElementById('btnNow').addEventListener('click', ()=>{ hardNotifyLog('click_btnNow', null); send('rest'); });
    // 关键修复：snooze 走 send() 直发，避免"内容先淡出、宿主后淡出"不同步。
    document.getElementById('btnLater').addEventListener('click', ()=>{ hardNotifyLog('click_btnLater', null); send('snooze'); });
    document.getElementById('btnClose').addEventListener('click', ()=>{ hardNotifyLog('click_btnClose', null); send('snooze'); });

    window.setMessage=(t)=>{ const el=document.getElementById('msg'); if(el) el.textContent=t||''; };
    window.notifyCardFadeIn=function(){
      try{
        var c=document.getElementById('card');
        if(c) c.classList.add('card-visible');
        if(c) c.classList.remove('fade-out');
        requestAnimationFrame(notifyReadyForShow);
      }catch(e){}
    };
    window.notifyCardFadeOut=function(){
      try{
        var c=document.getElementById('card');
        if(c) c.classList.add('fade-out');
      }catch(e){}
    };
    window.resetFade=()=>{
      try{
        // 先清掉上一轮的 autoHide 定时器，避免复用窗口时旧定时器在“第二次”马上触发
        if(window._hideTimer){ clearTimeout(window._hideTimer); window._hideTimer=null; }
        window._acted = false;
        const card=document.getElementById('card');
        if(card) card.classList.remove('fade-out');
        // 不在这里加 card-visible，渐入只由 notifyCardFadeIn（ACK+最小延迟）触发，避免瞬间出现
        hardNotifyLog('resetFade', null);
        requestAnimationFrame(notifyReadyForShow);
      }catch(e){}
    };
    window.autoHide=(seconds)=>{
      if(window._hideTimer) clearTimeout(window._hideTimer);
      window._acted = false;
      const sec = Math.max(1, Math.min(600, seconds|0));
      hardNotifyLog('autoHide_set', {seconds: sec});
      window._hideTimer=setTimeout(()=>{
        hardNotifyLog('autoHide_fire', {seconds: sec});
        if(window._acted){ hardNotifyLog('autoHide_skip_acted', {seconds: sec}); return; }
        // 统一走 dismiss：后端 fade_out -> hide，禁止直接 close/hide
        send('dismiss');
      }, sec*1000);
    };
  </script>
</body>
</html>
