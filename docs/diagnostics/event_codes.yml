schema_version: 1
name: eyecare_diagnostics_dictionary
version: "0.1.0"
generated_at: "2026-02-19"

naming:
  event_prefix: DIAG_
  reason_prefix: E_
  metric_prefix: DIAG_METRIC_

policies:
  - ALWAYS_ON
  - DEBUG_ONLY
  - DEPRECATED

defaults:
  throttle_window_s: 30
  include_stack: false
  pii_flag: none
  owner: core

runtime_controls:
  normal_mode:
    allow_policies: [ALWAYS_ON]
    block_event_patterns: ["*_STAGE", "*_PIPE*", "*_POST*", "*_WINDOW_OP*", "DIAG_HTTP", "DIAG_UI_LOG", "DIAG_SNAPSHOT_HIT"]
  debug_mode:
    allow_global_all: false
    default_modules: [notify, repo]
    available_modules: [notify, rest, repo, dispatch, api, style, runtime, tray]
    require_module_selection: true
  exception_throttle:
    reason_code_window_s: 30
    max_full_stack_per_window: 1
    count_remaining_only: true

