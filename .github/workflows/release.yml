name: Publish rolling Windows release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: Optional exact version (for example 2.0.0)
        required: false
        type: string
      notes:
        description: Optional short update notes
        required: false
        type: string

concurrency:
  group: eye-care-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Calculate and write next version
        id: version
        shell: pwsh
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          $current = (python scripts/sync_version.py --show).Trim()
          $custom = "$env:INPUT_CUSTOM_VERSION".Trim().TrimStart("v")
          if ($custom) {
            $next = $custom
          } else {
            $parts = $current.Split(".") | ForEach-Object { [int]$_ }
            if ($parts.Count -ne 3) { throw "Invalid source version: $current" }
            switch ("$env:INPUT_BUMP") {
              "major" { $next = "{0}.0.0" -f ($parts[0] + 1) }
              "minor" { $next = "{0}.{1}.0" -f $parts[0], ($parts[1] + 1) }
              default { $next = "{0}.{1}.{2}" -f $parts[0], $parts[1], ($parts[2] + 1) }
            }
          }
          if ($next -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $next" }
          python scripts/sync_version.py $next
          "version=$next" >> $env:GITHUB_OUTPUT
          "archive=EyE-Care-$next-Windows-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build application and independent updater
        run: python -m PyInstaller "EyE Care.spec" --noconfirm --clean

      - name: Prepare runtime resources
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist\EyE Care"
          $internal = Join-Path $dist "_internal"
          if (Test-Path (Join-Path $internal "eye_care")) {
            Copy-Item (Join-Path $internal "eye_care") $dist -Recurse -Force
          }
          foreach ($name in @("icon.ico", "icon.png", "README.md")) {
            $source = Join-Path $internal $name
            if (Test-Path $source) { Copy-Item $source $dist -Force }
          }
          New-Item (Join-Path $dist "user_data") -ItemType Directory -Force | Out-Null

      - name: Create package, checksum and repository manifest
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          python scripts/package_release.py "dist\EyE Care" `
            --version "${{ steps.version.outputs.version }}" `
            --archive `
            --output-dir dist `
            --feed-output "updates\latest.json" `
            --notes "$env:RELEASE_NOTES"

      - name: Verify the complete release archive
        run: python scripts/verify_release.py "dist\${{ steps.version.outputs.archive }}"

      - name: Ensure the single rolling Release exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest `
              --target main `
              --title "EyE Care 自动更新通道" `
              --notes "此 Release 是自动更新的固定下载通道，不代表版本号。实际版本以仓库 updates/latest.json 为准。"
          }

      - name: Upload versioned assets to the rolling Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "${{ steps.version.outputs.archive }}"
          gh release upload latest `
            "dist\$archive" `
            "dist\$archive.sha256" `
            --clobber

      # The manifest is pushed only after the asset exists. Clients therefore never see a
      # new version whose package has not finished uploading.
      - name: Commit version and latest manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eye_care/version.py version_info.txt updates/latest.json
          git commit -m "chore: publish v$version"
          git push origin HEAD:main

      - name: Refresh rolling Release description
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release edit latest `
            --title "EyE Care 自动更新通道（当前 v$version）" `
            --notes "固定自动更新通道。客户端版本与校验信息以仓库 updates/latest.json 为准；此 Release 永远只使用 latest 这一个 Tag。"

      - name: Keep only the three newest package versions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/latest" | ConvertFrom-Json
          $packages = $release.assets |
            Where-Object { $_.name -match '^EyE-Care-\d+\.\d+\.\d+-Windows-x64\.zip$' } |
            Sort-Object created_at -Descending
          $keep = @($packages | Select-Object -First 3 | ForEach-Object { $_.name })
          foreach ($asset in $release.assets) {
            $baseName = $asset.name -replace '\.sha256$', ''
            if ($baseName -match '^EyE-Care-\d+\.\d+\.\d+-Windows-x64\.zip$' -and $baseName -notin $keep) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
            }
          }
